<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Repo Filter</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>GitHub Repository Manager</h1>
        <p>Quickly fetch and filter repositories with ease!</p>
      </header>

      <section class="card">
        <label for="token">🔑 Enter GitHub Token</label>
        <input type="password" id="token" placeholder="Your GitHub token" />
        <div class="button-with-loader">
          <button id="fetchOrgs">Fetch Organizations</button>
          <div class="button-loader" id="fetchOrgsLoader"></div>
        </div>
      </section>

      <section class="card" id="orgContainer" style="display: none">
        <label for="organizations">🏢 Select Organization</label>
        <select id="organizations"></select>
        <div class="button-with-loader">
          <button id="fetchRepos">Fetch Repositories</button>
          <div class="button-loader" id="fetchReposLoader"></div>
        </div>
      </section>

      <section class="card" id="repoContainer" style="display: none">
        <label for="filter">🔍 Filter by Keyword</label>
        <input type="text" id="filter" placeholder="Enter keyword" />
        <div class="button-with-loader">
          <button id="filterRepos">Filter Repos</button>
          <div class="button-loader" id="filterReposLoader"></div>
      </div>
      <div class="loader" id="repoListLoader"></div>
      <ul id="repoList"></ul>
      </section>

      <section class="card" id="commandContainer" style="display: none">
        <h2>Generated Git Clone Commands</h2>
        <textarea id="commands" rows="10" readonly></textarea>
      </section>
    </div>
    <footer>Made with ❤️ by Mohammed Khallaf</footer>
    <script src="script.js"></script>
  </body>
</html>
